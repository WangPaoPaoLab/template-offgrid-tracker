# Complete configuration for the standalone VC0706-compatible serial camera
# diagnostic. It intentionally does not inherit prj.conf, so Bluetooth,
# networking, Wi-Fi, HaLow, sensors, settings, and crypto stay unselected.
CONFIG_OFFGRID_NRF54_CAMERA_TEST=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SERIAL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG=n
CONFIG_BOOT_BANNER=y
