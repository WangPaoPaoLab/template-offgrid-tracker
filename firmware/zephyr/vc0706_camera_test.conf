# Complete configuration for the standalone VC0706-compatible serial camera
# diagnostic with camera-only BLE service. Does not inherit prj.conf.
# Wi-Fi, HaLow, networking and sensor services stay unselected.
CONFIG_OFFGRID_NRF54_CAMERA_TEST=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SERIAL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_UART_ASYNC_API=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG=n
CONFIG_BOOT_BANNER=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="EdgeZ-Camera"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_SMP=n
CONFIG_BT_L2CAP_TX_MTU=300
CONFIG_BT_BUF_ACL_RX_SIZE=304
CONFIG_BT_BUF_ACL_TX_SIZE=304
CONFIG_BT_BUF_ACL_TX_COUNT=6
CONFIG_BT_ATT_TX_COUNT=6
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192
