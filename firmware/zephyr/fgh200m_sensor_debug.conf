# Functional PAwR sensor validation with RTT logs.
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Exercise the production telemetry, downlink, and MM8108 chip-sleep state
# machine. RTT is for functional validation only and changes measured current.
CONFIG_OFFGRID_NRF54_SENSOR_PAWR_BULK_TEST=n
CONFIG_OFFGRID_NRF54_SENSOR_HALOW_POWER_SAVE=y
CONFIG_OFFGRID_NRF54_SENSOR_PS_PROBE=y
CONFIG_OFFGRID_NRF54_SENSOR_RX_SLEEP_COMPARE=y
CONFIG_OFFGRID_NRF54_SENSOR_TWT_PROBE=y
CONFIG_OFFGRID_NRF54_SENSOR_TWT_STATE_PROBE=y
CONFIG_OFFGRID_NRF54_SENSOR_PAWR_TWT_TEST=y
